# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# This static fork configuration takes precedence over .coderabbit.config.ts.
language: en-US

reviews:
  high_level_summary: false
  review_status: true
  request_changes_workflow: true
  # Static YAML applies the existing contributor restrictions to every author.
  allow_author_approval: false
  auto_review:
    enabled: true
    base_branches:
      - ".*"
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: "off"
  path_filters:
    - "!.repos/**"
  path_instructions:
    - path: "{apps,packages,infra}/**/*.ts"
      instructions: Hold changed code to the rules in docs/internals/effect-services.md.
    - path: "apps/web/src/**/*.{tsx,css}"
      instructions: Hold changed code to the rules in docs/internals/web-ui.md.

knowledge_base:
  code_guidelines:
    filePatterns:
      - files: docs/internals/effect-services.md
        applyTo: "{apps,packages,infra}/**/*.ts"
      - files: docs/internals/web-ui.md
        applyTo: "apps/web/src/**/*.{tsx,css}"
